<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Firefly Jar, a Rive mini-game</title><style>
:root{--bg:#f3efe6;--ink:#0e1a2b;--muted:#5b6574;--card:#fbf8f2;--line:#0e1a2b1f;--accent:#1f8a74}
@media (prefers-color-scheme: dark){:root{--bg:#12161d;--ink:#eef1f5;--muted:#9aa4b2;--card:#1a2029;--line:#ffffff22;--accent:#4fd1b0}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:1100px;margin:0 auto;padding:40px 16px 64px}
a{color:var(--accent)}h1{font-size:clamp(28px,4vw,44px);line-height:1.1;margin:0 0 8px;letter-spacing:-.02em}
.lede{color:var(--muted);max-width:640px;margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-decoration:none;color:inherit;display:block}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}.card div{padding:14px 16px 18px}
.card b{display:block;font-size:17px}.card span{color:var(--muted);font-size:14px}
#stage{position:relative;width:100%;aspect-ratio:4/3;background:#f3efe6;border-radius:18px;overflow:hidden;border:1px solid var(--line)}
#stage canvas{width:100%;height:100%;display:block}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
footer{margin-top:28px;color:var(--muted);font-size:14px}
</style></head><body><main><div class="top"><div><div class="eyebrow">Live Rive file</div><h1>Firefly Jar, a Rive mini-game</h1></div><a href="index.html">All pieces</a></div><p class="lede">Press <b>Start round</b> and slide the jar with your pointer. Every sprite is a Rive artboard; a Luau script runs the round and data binding drives the HUD.</p><div id="stage" data-riv="firefly.riv" data-machine="Game Machine"></div><footer>Runs on @rive-app/webgl2 2.49.4. By Muhammad Ali Sabir, <a href="https://contra.com/ali_sabir_bh29rvhc">Contra</a>.</footer></main><script src="https://cdn.jsdelivr.net/npm/@rive-app/webgl2@2.49.4/rive.js"></script><script src="player.js"></script></body></html>
